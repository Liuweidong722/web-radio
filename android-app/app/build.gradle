plugins {
    id 'com.android.application'
}

android {
    namespace 'com.webradio.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.webradio.app"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 只用 WebView 官方支持库，避免 appcompat 带来的 kotlin-stdlib 版本冲突
    implementation 'androidx.webkit:webkit:1.11.0'
}
